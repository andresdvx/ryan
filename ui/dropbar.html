<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ryan - Soltar un archivo</title>
  <link rel="stylesheet" href="dropbar.css">
</head>
<body>
  <main id="wrap" class="wrap">
    <div class="bar" role="group" aria-label="Qué hacer con el archivo que arrastras">
      <div class="zone" data-zone="analyze"><span class="emoji" aria-hidden="true">🔍</span><span class="label">Analizar</span></div>
      <div class="zone" data-zone="summarize"><span class="emoji" aria-hidden="true">📝</span><span class="label">Resumir</span></div>
      <div class="zone" data-zone="convert"><span class="emoji" aria-hidden="true">🔄</span><span class="label">Convertir</span></div>
    </div>
    <div class="tail" aria-hidden="true"><i class="dot big"></i><i class="dot small"></i></div>
  </main>
  <script src="dropbar.js"></script>
</body>
</html>
